<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>安全员考核刷题器 · B类</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#1a73e8;--blue-d:#0d47a1;--green:#2e9e5b;--red:#e5484d;--bg:#f4f6fa;--card:#fff;--text:#222;--gray:#8a8f98;--line:#eef0f4}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;max-width:720px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(26,115,232,.25)}
.topbar .tabs{display:flex;gap:6px;margin-left:auto}
.topbar .tab{padding:6px 14px;border-radius:20px;font-size:14px;cursor:pointer;background:rgba(255,255,255,.18);transition:.2s}
.topbar .tab.active{background:#fff;color:var(--blue);font-weight:600}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.85}
.page{padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 4px 16px rgba(26,115,232,.3)}
.hero h1{font-size:20px;margin-bottom:4px}
.hero p{font-size:12px;opacity:.85;margin-bottom:18px}
.hero .stats{display:flex;justify-content:space-around;text-align:center;background:rgba(255,255,255,.15);border-radius:12px;padding:14px 6px}
.hero .stats .num{font-size:24px;font-weight:700}
.hero .stats .lbl{font-size:11px;opacity:.85;margin-top:2px}
.cat-row{display:flex;flex-wrap:wrap;gap:10px}
.cat-chip{flex:1 1 calc(33% - 10px);min-width:90px;text-align:center;padding:12px 6px;border-radius:12px;cursor:pointer;transition:.15s;border:2px solid var(--line)}
.cat-chip:active{transform:scale(.96)}
.cat-chip .nm{font-size:14px;font-weight:600}
.cat-chip .ct{font-size:12px;color:var(--gray);margin-top:2px}
.cat-chip.fl{border-color:#cfe2ff}
.cat-chip.gl{border-color:#ffdde2}
.cat-chip.js{border-color:#cdeedb}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-card{background:var(--card);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.05);transition:.15s}
.menu-card:active{transform:scale(.96)}
.menu-card .ic{font-size:30px;margin-bottom:8px}
.menu-card .nm{font-size:15px;font-weight:600}
.menu-card .ds{font-size:11px;color:var(--gray);margin-top:3px}
.section-title{font-size:15px;font-weight:700;margin:18px 2px 10px;color:#444}
.filters{display:flex;flex-direction:column;gap:12px}
.filter-group label{font-size:13px;color:var(--gray);margin-bottom:6px;display:block}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;background:#f0f2f6;color:#555;border:1px solid transparent;transition:.15s}
.chip.active{background:#e3efff;color:var(--blue);border-color:var(--blue);font-weight:600}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s;margin-top:4px}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn-red{background:linear-gradient(135deg,#ff6b6b,var(--red));color:#fff}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
.btn-sm.primary{background:var(--blue);color:#fff}
.btn-sm.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn-sm.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.q-head .tag{font-size:12px;padding:3px 10px;border-radius:6px;color:#fff}
.tag.fl{background:var(--blue)}.tag.gl{background:var(--red)}.tag.js{background:var(--green)}
.q-head .typ{font-size:12px;padding:3px 10px;border-radius:6px;background:#f0f2f6;color:#666}
.q-head .cnt{margin-left:auto;font-size:13px;color:var(--gray)}
.q-text{font-size:16px;line-height:1.75;margin-bottom:6px}
.q-text .blank{display:inline-block;min-width:60px;border-bottom:1.5px solid var(--blue);margin:0 2px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:13px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:.15s}
.opt .k{width:28px;height:28px;border-radius:50%;background:#f0f2f6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#666}
.opt .tx{flex:1;font-size:15px}
.opt.sel{border-color:var(--blue);background:#eef5ff}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.right{border-color:var(--green);background:#e9f7ef}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.wrong .k{background:var(--red);color:#fff}
.hint{font-size:12px;color:var(--red);text-align:center;margin:6px 0}
.answer-box{margin-top:14px;padding:14px;border-radius:11px;background:#f6f8fc;border:1px dashed #ccd6e6}
.answer-box .res{font-size:16px;font-weight:700;margin-bottom:6px}
.answer-box .res.ok{color:var(--green)}.answer-box .res.no{color:var(--red)}
.answer-box .corr{font-size:14px;color:#444}
.nav-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.nav-bar .pg{font-size:13px;color:var(--gray);white-space:nowrap}
.progress{flex:1;height:5px;background:#e8eaed;border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-d));transition:width .25s}
.sheet{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.sheet div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;background:#f0f2f6;color:#888}
.sheet div.cur{background:var(--blue);color:#fff;font-weight:700;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.sheet div.ok{background:#e9f7ef;color:var(--green);font-weight:600}
.sheet div.no{background:#fdeeee;color:var(--red);font-weight:600}
.timer-bar{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.timer-bar .tm{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.timer-bar .tm.warn{color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.result-hero{text-align:center;padding:26px 10px}
.result-hero .circle{width:130px;height:130px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,var(--blue),var(--blue-d));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.result-hero .circle .n{font-size:42px;font-weight:800}
.result-hero .circle .l{font-size:13px;opacity:.85}
.result-hero .st{font-size:20px;font-weight:700}
.result-hero .st.pass{color:var(--green)}.result-hero .st.fail{color:var(--red)}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;color:#555;border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:60px 20px;color:var(--gray)}
.empty .ic{font-size:54px;margin-bottom:12px}
.empty .t{font-size:17px;color:#444;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:100px}
.mistake-item{margin-bottom:12px}
.mistake-item .m-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.mistake-item .m-head .tag{font-size:11px;padding:2px 8px;border-radius:5px;color:#fff}
.mistake-item .m-q{font-size:14px;margin-bottom:8px;line-height:1.6}
.mistake-item .m-opt{font-size:13px;padding:7px 10px;border-radius:8px;margin-bottom:5px;background:#f9fafc}
.mistake-item .m-opt.hl{background:#e9f7ef;border:1px solid var(--green);font-weight:600}
.mistake-item .m-ans{font-size:13px;color:var(--green);font-weight:600;margin:6px 0}
</style>
</head>

LS.saveStat=function(){localStorage.setItem('ak_stat',JSON.stringify(this.stat));};
LS.addWrong=function(q){if(!this.wrong.some(function(w){return w.id===q.id;})){this.wrong.push({id:q.id,c:q.c,t:q.t,q:q.q,o:q.o,a:q.a});this.saveWrong();}};
LS.delWrong=function(id){this.wrong=this.wrong.filter(function(w){return w.id!==id;});this.saveWrong();};
LS.clearWrong=function(){this.wrong=[];this.saveWrong();};
LS.record=function(qid,ok){var s=this.stat[qid]||{ok:0,total:0};s.total++;if(ok)s.ok++;this.stat[qid]=s;this.saveStat();};
LS.accuracy=function(){var ok=0,tot=0;Object.keys(this.stat).forEach(function(k){var s=LS.stat[k];ok+=s.ok;tot+=s.total;});return tot?Math.round(ok/tot*100):0;};

/* ============ 练习核心 ============ */
var QZ=null;
function startMode(mode){
  var list=ALL.slice();
  if(mode==='rand')list=shuffle(list).slice(0,50);
  if(mode==='seq')list=list;
  startQuiz({list:list,title:'顺序练习',mode:mode});

function startQuiz(cfg){
  QZ={list:cfg.list,title:cfg.title,mode:cfg.mode,idx:0,sel:[],show:false,ok:0,no:0,wrongIds:{}};
  renderDo();go('do');
}
function cur(){return QZ.list[QZ.idx];}
function renderDo(){
  var q=cur();
  if(!q){renderResult();return;}
  var isMulti=(q.t==='多选题');
  var last=QZ.list.length-1;
  $('#page-do').innerHTML=''+
    '<div class="card">'+
      '<div class="q-head">'+
        '<span class="tag '+CAT_COLOR[Object.keys(CAT_NAME).filter(function(k){return CAT_NAME[k]===q.c;})[0]]+'">'+q.c+'</span>'+
        '<span class="typ">'+q.t+'</span>'+
        '<span class="cnt">'+(QZ.idx+1)+' / '+QZ.list.length+'</span>'+
      '</div>'+
      '<div class="q-text">'+renderStem(q.q)+'</div>'+
      '<div class="options" id="opt-box"></div>'+
      (!QZ.show ? (isMulti?'<div class="hint">多选题，请选择所有正确答案</div>':'') : '')+
      (QZ.show?answerHtml(q):'')+
    '</div>'+
    '<div class="nav-bar">'+
      '<span class="pg">'+Math.round(QZ.idx/last*100)+'%</span>'+
      '<div class="progress"><i style="width:'+(QZ.idx/last*100)+'%"></i></div>'+
      (QZ.show
        ? '<button class="btn btn-primary" style="width:auto;padding:10px 22px;margin:0" id="btn-next">'+(QZ.idx===last?'完成':'下一题')+'</button>'
        : '<button class="btn btn-primary" style="width:auto;padding:10px 22px;margin:0" id="btn-submit">确认答案</button>')+
    '</div>';
  renderOptions(q);
  if($('#btn-submit'))$('#btn-submit').onclick=submit;
  if($('#btn-next'))$('#btn-next').onclick=next;
}
function catKeyOf(c){var ks=Object.keys(CAT_NAME);for(var i=0;i<ks.length;i++)if(CAT_NAME[ks[i]]===c)return ks[i];return '';}
function renderStem(txt){return esc(txt).replace(/（\s*）/g,'（<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>）');}
function renderOptions(q){
  var box=$('#opt-box');
  var labels=(q.t==='判断题')?['正确','错误']:null;
  var html='';
  for(var i=0;i<q.o.length;i++){
    var k=String.fromCharCode(65+i);
    var tx=labels?labels[i]:esc(q.o[i]);
    var cls=optClass(q,k);
    html+='<div class="opt '+cls+'" data-k="'+k+'"><span class="k">'+k+'</span><span class="tx">'+tx+'</span></div>';
  }
  box.innerHTML=html;
  var opts=box.querySelectorAll('.opt');
  for(i=0;i<opts.length;i++){opts[i].onclick=function(){pick(this.dataset.k);};}
}
function optClass(q,k){
  if(!QZ.show)return QZ.sel.indexOf(k)>=0?'sel':'';
  var right=norm(q.a).indexOf(k)>=0;
  if(right)return 'right';
  if(QZ.sel.indexOf(k)>=0)return 'wrong';
  return '';
}
function answerHtml(q){
  var want=norm(q.a),got=norm(QZ.sel.join(''));
  var ok=(want.length===1)?(want===got):(want===got);
  return '<div class="answer-box"><div class="res '+(ok?'ok':'no')+'">'+(ok?'✓ 回答正确':'✗ 回答错误')+'</div><div class="corr">正确答案：'+q.a.split('').join(' / ')+'</div></div>';
}
function pick(k){
  if(QZ.show)return;
  var q=cur();
  if(q.t==='多选题'){
    var i=QZ.sel.indexOf(k);
    if(i>=0)QZ.sel.splice(i,1);else QZ.sel.push(k);
  }else{QZ.sel=[k];}
  renderDo();
}
function submit(){
  var q=cur();
  if(!QZ.sel.length){toast('请先选择答案');return;}
  var want=norm(q.a),got=norm(QZ.sel.join(''));
  var ok=(want.length===1)?(want===got):(want===got);
  if(ok)QZ.ok++;else{QZ.no++;QZ.wrongIds[q.id]=1;LS.addWrong(q);}
  LS.record(q.id,ok);
  QZ.show=true;
  renderDo();
}
function next(){
  if(QZ.idx===QZ.list.length-1){renderResult();return;}
  QZ.idx++;QZ.sel=[];QZ.show=false;
  renderDo();
}

/* ============ 模拟考试 ============ */
var EX=null;
function startExam(mins){
  var singles=shuffle(ALL.filter(function(q){return q.t==='单选题';})).slice(0,40);
  var multis=shuffle(ALL.filter(function(q){return q.t==='多选题';})).slice(0,20);
  var judges=shuffle(ALL.filter(function(q){return q.t==='判断题';})).slice(0,40);
  var list=shuffle(singles.concat(multis,judges));
  EX={list:list,idx:0,sel:[],sheet:list.map(function(){return {ok:null,answered:false};}),time:mins*60,tm:null,score:0,ok:0,no:0};
  renderExam();go('exam');startTimer();
}
function startTimer(){
  clearInterval(EX.tm);tick();
  EX.tm=setInterval(tick,1000);
}
function tick(){
  var m=Math.floor(EX.time/60),s=EX.time%60;
  var el=$('#exam-timer');
  if(el){el.textContent=m+':'+String(s).padStart(2,'0');el.classList.toggle('warn',EX.time<=300);}
  if(EX.time<=0){clearInterval(EX.tm);finishExam(true);return;}
  EX.time--;
}
function renderExam(){
  var q=EX.list[EX.idx],last=EX.list.length-1;
  $('#page-exam').innerHTML=''+
    '<div class="timer-bar">'+
      '<span class="tm" id="exam-timer">--:--</span>'+
      '<span style="font-size:13px;color:#666">'+(EX.idx+1)+' / '+EX.list.length+'</span>'+
      '<button class="btn-sm red" id="btn-submit-exam">交卷</button>'+
    '</div>'+
    '<div class="page" style="padding:12px">'+
      '<div class="card">'+
        '<div class="q-head">'+
          '<span class="tag '+CAT_COLOR[catKeyOf(q.c)]+'>'+q.c+'</span>'+
          '<span class="typ">'+q.t+' · '+(q.t==='多选题'?'2分':'1分')+'</span>'+
        '</div>'+
        '<div class="q-text">'+renderStem(q.q)+'</div>'+
        '<div class="options" id="opt-box"></div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title" style="margin:0 0 10px">答题卡</div>'+
        '<div class="sheet" id="sheet-box"></div>'+
      '</div>'+
      '<div class="nav-bar" style="position:static;box-shadow:none;padding:10px 0">'+
        '<button class="btn-sm ghost" id="ex-prev" '+(EX.idx===0?'disabled':'')+'>上一题</button>'+
        '<button class="btn-sm primary" id="ex-next" style="margin-left:auto">'+(EX.idx===last?'最后一题':'下一题')+'</button>'+
      '</div>'+
    '</div>';
  renderExamOptions(q);renderSheet();
  $('#ex-prev').onclick=function(){move(-1);};
  $('#ex-next').onclick=function(){move(1);};
  $('#btn-submit-exam').onclick=function(){if(confirm('确定要交卷吗？'))finishExam(false);};
}
function renderExamOptions(q){
  var box=$('#opt-box');
  var labels=(q.t==='判断题')?['正确','错误']:null;
  var html='';
  for(var i=0;i<q.o.length;i++){
    var k=String.fromCharCode(65+i);
    html+='<div class="opt '+(EX.sel.indexOf(k)>=0?'sel':'')+'" data-k="'+k+'"><span class="k">'+k+'</span><span class="tx">'+(labels?labels[i]:esc(q.o[i]))+'</span></div>';
  }
  box.innerHTML=html;
  var opts=box.querySelectorAll('.opt');
  for(i=0;i<opts.length;i++){opts[i].onclick=function(){
    var k=this.dataset.k,q=EX.list[EX.idx];
    if(q.t==='多选题'){var ii=EX.sel.indexOf(k);if(ii>=0)EX.sel.splice(ii,1);else EX.sel.push(k);}
    else EX.sel=[k];
    EX.sheet[EX.idx].answered=EX.sel.length>0;
    renderExam();
  };}
}
function renderSheet(){
  var html='';
  for(var i=0;i<EX.sheet.length;i++){
    var s=EX.sheet[i],cls='';
    if(i===EX.idx)cls='cur';else if(s.ok===true)cls='ok';else if(s.ok===false)cls='no';
    html+='<div class="'+cls+'" data-i="'+i+'">'+(i+1)+'</div>';
  }
  $('#sheet-box').innerHTML=html;
  var cells=$('#sheet-box').querySelectorAll('div');
  for(i=0;i<cells.length;i++){cells[i].onclick=function(){EX.idx=+this.dataset.i;EX.sel=[];renderExam();};}
}
function move(d){
  EX.idx=Math.max(0,Math.min(EX.list.length-1,EX.idx+d));EX.sel=[];renderExam();window.scrollTo(0,0);
}
function finishExam(auto){
  clearInterval(EX.tm);
  for(var i=0;i<EX.list.length;i++){
    var q=EX.list[i];
    var sel=EX.sheet[i].answered?(i===EX.idx?norm(EX.sel.join('')):''):'';
    if(i===EX.idx)sel=norm(EX.sel.join(''));
    var ok=(sel&&norm(q.a)===sel);
    EX.sheet[i].ok=ok;
    if(ok){EX.ok++;EX.score+=(q.t==='多选题'?2:1);}else{EX.no++;LS.addWrong(q);}
    LS.record(q.id,ok);
  }
  var acc=EX.list.length?Math.round(EX.ok/EX.list.length*100):0;
  $('#page-result').innerHTML=''+
    '<div class="card result-hero">'+
      '<div class="circle"><div class="n">'+EX.score+'</div><div class="l">总分 / 120</div></div>'+
      '<div class="st '+(EX.score>=60?'pass':'fail')+'">'+(EX.score>=60?'恭喜及格！':'未达到及格线')+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="detail-row"><span>单选题</span><span>40题 × 1分</span></div>'+
      '<div class="detail-row"><span>多选题</span><span>20题 × 2分</span></div>'+
      '<div class="detail-row"><span>判断题</span><span>40题 × 1分</span></div>'+
      '<div class="detail-row"><span>答对 / 答错</span><span>'+EX.ok+' / '+EX.no+'</span></div>'+
      '<div class="detail-row"><span>正确率</span><span>'+acc+'%</span></div>'+
      '<div class="detail-row"><span>及格线</span><span>60分</span></div>'+
    '</div>'+
    '<div class="card" style="display:flex;flex-direction:column;gap:10px">'+
      '<button class="btn btn-primary" id="rev-all">查看全部解析</button>'+
      '<button class="btn btn-ghost" id="ex-home">返回首页</button>'+
    '</div>';
  $('#rev-all').onclick=reviewExam;
  $('#ex-home').onclick=function(){renderHome();go('home');};
  go('result');
}
function reviewExam(){
  var i=0;
  function draw(){
    var q=EX.list[i],ok=EX.sheet[i].ok;
    var html='<div class="page" style="padding:12px"><div class="card">'+
      '<div class="q-head">'+
        '<span class="tag '+CAT_COLOR[catKeyOf(q.c)]+'>'+q.c+'</span>'+
        '<span class="typ">'+q.t+'</span>'+
        '<span class="cnt">'+(i+1)+' / '+EX.list.length+'</span>'+
        '<span class="typ" style="color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'✓ 正确':'✗ 错误')+'</span>'+
      '</div>'+
      '<div class="q-text">'+renderStem(q.q)+'</div>';
    for(var j=0;j<q.o.length;j++){
      var k=String.fromCharCode(65+j);
      var right=norm(q.a).indexOf(k)>=0;
      var cls='';if(right)cls='right';else if(EX.sel.indexOf(k)>=0)cls='wrong';
      html+='<div class="opt '+cls+'"><span class="k">'+k+'</span><span class="tx">'+esc(q.o[j])+'</span></div>';
    }
    html+='<div class="answer-box"><div class="corr">正确答案：'+q.a.split('').join(' / ')+'</div></div></div>'+
      '<div class="nav-bar" style="position:static;box-shadow:none;padding:10px 0">'+
        '<button class="btn-sm ghost" '+(i===0?'disabled':'')+' id="rv-p">上一题</button>'+
        '<span class="pg">'+Math.round(i/(EX.list.length-1)*100)+'%</span>'+
        '<button class="btn-sm primary" id="rv-n" style="margin-left:auto">'+(i===EX.list.length-1?'返回':'下一题')+'</button>'+
      '</div></div>';
    $('#page-result').innerHTML=html;
    $('#rv-p').onclick=function(){if(i>0){i--;draw();}};
    $('#rv-n').onclick=function(){if(i<EX.list.length-1){i++;draw();}else{renderHome();go('home');}};
  }
  draw();
}

/* ============ 错题本 ============ */
function renderWrong(){
  var ws=LS.wrong.slice().reverse();
  if(!ws.length){
    $('#page-wrong').innerHTML='<div class="empty"><div class="ic">🎯</div><div class="t">还没有错题</div><div>多做练习，把错题都消灭掉吧！</div><button class="btn btn-primary" style="margin-top:20px;width:auto;padding:12px 30px" onclick="renderHome();go(&quot;home&quot;)">开始练习</button></div>';
    return;
  }
  var html='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><strong>共 '+ws.length+' 道错题</strong><div style="display:flex;gap:8px"><button class="btn-sm primary" id="wp-all">全部重练</button><button class="btn-sm red" id="wp-clear">清空</button></div></div></div>';
  for(var i=0;i<ws.length;i++){
    var w=ws[i];
    html+='<div class="card mistake-item">'+
      '<div class="m-head"><span class="tag '+CAT_COLOR[catKeyOf(w.c)]+'>'+w.c+'</span><span class="typ">'+w.t+'</span><span class="typ" style="color:var(--green)">答案 '+w.a+'</span></div>'+
      '<div class="m-q">'+esc(w.q)+'</div>';
    for(var j=0;j<w.o.length;j++){
      var k=String.fromCharCode(65+j);
      html+='<div class="m-opt '+(norm(w.a).indexOf(k)>=0?'hl':'')+'">'+k+'. '+esc(w.o[j])+'</div>';
    }
    html+='<div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn-sm red" data-del="'+w.id+'">移除</button></div></div>';
  }
  $('#page-wrong').innerHTML=html;
  $('#wp-all').onclick=function(){
    var list=shuffle(ws.map(function(w){return {id:w.id,c:w.c,t:w.t,q:w.q,o:w.o,a:w.a};}));
    startQuiz({list:list,title:'错题重练',mode:'wrong'});
  };
  $('#wp-clear').onclick=function(){if(confirm('确定清空 '+ws.length+' 道错题？')){LS.clearWrong();renderWrong();renderHome();}};
  var dels=$('#page-wrong').querySelectorAll('[data-del]');
  for(i=0;i<dels.length;i++){dels[i].onclick=function(){LS.delWrong(+this.dataset.del);renderWrong();renderHome();};}
}

/* ============ 启动 ============ */
bindTabs();
renderHome();
</script>
</body>
</html>
