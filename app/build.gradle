plugins {
    id 'com.android.application'
}

// 读取签名配置（CI 用 keystore.properties，本地用环境变量）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.anquan.kaoshi'
    compileSdk 34

    defaultConfig {
        applicationId "com.anquan.kaoshi"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // 优先用 keystore.properties（CI），否则读环境变量（本地）
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS")
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD")
            storeFile file(keystoreProperties['storeFile'] ?: System.getenv("KEYSTORE_PATH") ?: "app/release-key.jks")
            storePassword keystoreProperties['storePassword'] ?: System.getenv("KEY_STORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
